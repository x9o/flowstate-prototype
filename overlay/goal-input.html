<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
  <title>Flowstate</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #e0e0e0;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    /* Custom Titlebar */
    .titlebar {
      height: 40px;
      background: rgba(0, 0, 0, 0.3);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 15px;
      -webkit-app-region: drag;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .titlebar-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      opacity: 0.9;
    }

    .titlebar-controls {
      display: flex;
      gap: 10px;
      -webkit-app-region: no-drag;
    }

    .titlebar-button {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .titlebar-button.close {
      background: #ff5f56;
    }

    .titlebar-button.minimize {
      background: #ffbd2e;
    }

    .titlebar-button.maximize {
      background: #27c93f;
    }

    .titlebar-button:hover {
      opacity: 0.8;
      transform: scale(1.1);
    }

    /* Main Content */
    .container {
      padding: 40px;
      height: calc(100vh - 40px);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .app-icon {
      font-size: 64px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 15px;
      opacity: 0.7;
      font-weight: 400;
    }

    /* Input Section */
    .input-section {
      background: rgba(255, 255, 255, 0.05);
      padding: 25px;
      border-radius: 16px;
      margin-bottom: 30px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .input-label {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.7;
      margin-bottom: 12px;
    }

    .input-group {
      display: flex;
      gap: 10px;
    }

    #goalInput {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 15px;
      color: #e0e0e0;
      font-family: inherit;
      transition: all 0.3s ease;
    }

    #goalInput:focus {
      outline: none;
      border-color: #667eea;
      background: rgba(255, 255, 255, 0.1);
    }

    #goalInput::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    .btn {
      padding: 14px 24px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #e0e0e0;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    /* Task List */
    .task-section {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 600;
      opacity: 0.9;
    }

    .task-count {
      background: rgba(102, 126, 234, 0.2);
      color: #667eea;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
    }

    #taskList {
      list-style: none;
      flex: 1;
      overflow-y: auto;
      padding-right: 10px;
    }

    #taskList::-webkit-scrollbar {
      width: 6px;
    }

    #taskList::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
    }

    #taskList::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
    }

    #taskList::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .task-item {
      background: rgba(255, 255, 255, 0.05);
      padding: 16px 20px;
      border-radius: 12px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .task-item:hover {
      background: rgba(255, 255, 255, 0.08);
      transform: translateX(5px);
    }

    .task-item.active {
      border-color: #667eea;
      background: rgba(102, 126, 234, 0.1);
    }

    .task-content {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .task-icon {
      font-size: 20px;
    }

    .task-text {
      font-size: 15px;
      font-weight: 500;
    }

    .task-actions {
      display: flex;
      gap: 8px;
    }

    .task-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 18px;
      padding: 6px 10px;
      border-radius: 8px;
      transition: all 0.2s ease;
      opacity: 0.6;
    }

    .task-btn:hover {
      opacity: 1;
      background: rgba(255, 255, 255, 0.1);
    }

    .task-btn.delete:hover {
      background: rgba(255, 87, 87, 0.2);
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      opacity: 0.5;
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 15px;
    }

    .empty-state-text {
      font-size: 15px;
    }

    /* Action Bar */
    .action-bar {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      gap: 12px;
    }

    .btn-start {
      flex: 1;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 16px;
      font-size: 16px;
      position: relative;
      overflow: hidden;
    }

    .btn-start:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-start:not(:disabled):hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
    }

    .status-indicator {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 8px;
      animation: pulse 2s ease-in-out infinite;
    }

    .status-indicator.active {
      background: #27c93f;
    }

    .status-indicator.inactive {
      background: #666;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.5;
      }
    }

    /* Monitoring Output Section */
    .monitoring-section {
      margin-top: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.2);
      overflow: hidden;
    }

    .monitoring-section .section-header {
      padding: 15px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .monitoring-status {
      padding: 20px;
      text-align: center;
    }

    .status-text {
      font-size: 16px;
      font-weight: 500;
      margin-bottom: 10px;
      color: #4CAF50;
    }

    .status-info {
      font-size: 13px;
      opacity: 0.7;
      color: #e0e0e0;
    }
  </style>
</head>
<body>
  <!-- Custom Titlebar -->
  <div class="titlebar">
    <div class="titlebar-title">FlowState</div>
    <div class="titlebar-controls">
      <button class="titlebar-button minimize" id="minimizeBtn"></button>
      <button class="titlebar-button maximize" id="maximizeBtn"></button>
      <button class="titlebar-button close" id="closeBtn"></button>
    </div>
  </div>

  <!-- Main Content -->
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="app-icon">🎯</div>
      <h1>FlowState</h1>
      <p class="subtitle">Stay focused on what matters</p>
    </div>

    <!-- Input Section -->
    <div class="input-section">
      <div class="input-label">Add a goal</div>
      <div class="input-group">
        <input
          type="text"
          id="goalInput"
          placeholder="e.g., Write research paper, Build website feature..."
          autocomplete="off"
        />
        <button class="btn btn-primary" id="addGoalBtn">Add</button>
      </div>
    </div>

    <!-- Task List -->
    <div class="task-section">
      <div class="section-header">
        <div class="section-title">Your Goals</div>
        <div class="task-count" id="taskCount">0</div>
      </div>

      <ul id="taskList">
        <!-- Empty state shown when no tasks -->
        <div class="empty-state" id="emptyState">
          <div class="empty-state-icon">📝</div>
          <div class="empty-state-text">No goals yet. Add one to get started!</div>
        </div>
      </ul>
    </div>

    <!-- Monitoring Status Section (Hidden by default) -->
    <div class="monitoring-section" id="monitoringSection" style="display: none;">
      <div class="section-header">
        <div class="section-title">
          <span class="status-indicator active"></span>
          Monitoring Active
        </div>
      </div>
      <div class="monitoring-status" id="monitoringStatus">
        <div class="status-text" id="statusText">🔍 Monitoring your activity...</div>
        <div class="status-info">Blocking screens will appear when needed</div>
      </div>
    </div>

    <!-- Action Bar -->
    <div class="action-bar">
      <button class="btn btn-start" id="startBtn" disabled>
        <span class="status-indicator inactive"></span>
        Start Monitoring
      </button>
    </div>
  </div>

  <script>
    // State management
    let tasks = [];
    let activeTaskId = null;
    let isMonitoring = false;

    // Load tasks from storage on startup
    window.addEventListener('DOMContentLoaded', () => {
      loadTasks();
      setupEventListeners();
    });

    function setupEventListeners() {
      // Window controls
      document.getElementById('minimizeBtn').addEventListener('click', () => {
        window.electronAPI.minimizeWindow();
      });

      document.getElementById('maximizeBtn').addEventListener('click', () => {
        window.electronAPI.maximizeWindow();
      });

      document.getElementById('closeBtn').addEventListener('click', () => {
        window.electronAPI.closeWindow();
      });

      // Goal input
      document.getElementById('addGoalBtn').addEventListener('click', addGoal);
      document.getElementById('goalInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') addGoal();
      });

      // Start/Stop monitoring button
      document.getElementById('startBtn').addEventListener('click', toggleMonitoring);

      // Listen for monitoring events
      window.electronAPI.onMonitoringStarted((data) => {
        if (data.success) {
          isMonitoring = true;
          updateStartButton();
          showMonitoringSection();
        } else {
          console.error('Failed to start monitoring:', data.message);
          alert('Failed to start monitoring: ' + (data.message || 'Unknown error'));
        }
      });

      window.electronAPI.onMonitoringStopped((data) => {
        isMonitoring = false;
        updateStartButton();
        hideMonitoringSection();
      });

      window.electronAPI.onMonitoringStatus((status) => {
        isMonitoring = status.monitoring;
        updateStartButton();

        // Update status text if message provided
        if (status.message) {
          updateStatusText(status.message);
        }
      });
    }

    function addGoal() {
      const input = document.getElementById('goalInput');
      const goalText = input.value.trim();

      if (!goalText) return;

      const task = {
        id: Date.now(),
        text: goalText,
        createdAt: new Date().toISOString()
      };

      tasks.push(task);
      input.value = '';

      saveTasks();
      renderTasks();
    }

    function removeTask(taskId) {
      tasks = tasks.filter(t => t.id !== taskId);
      if (activeTaskId === taskId) {
        activeTaskId = null;
      }
      saveTasks();
      renderTasks();
    }

    function setActiveTask(taskId) {
      activeTaskId = taskId;
      renderTasks();
    }

    function renderTasks() {
      const taskList = document.getElementById('taskList');
      const taskCount = document.getElementById('taskCount');

      taskCount.textContent = tasks.length;

      if (tasks.length === 0) {
        // Show empty state
        taskList.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📝</div>
            <div class="empty-state-text">No goals yet. Add one to get started!</div>
          </div>
        `;
        updateStartButton();
        return;
      }

      // Render tasks
      taskList.innerHTML = tasks.map(task => `
        <li class="task-item ${task.id === activeTaskId ? 'active' : ''}" data-id="${task.id}">
          <div class="task-content">
            <div class="task-icon">${task.id === activeTaskId ? '🎯' : '📌'}</div>
            <div class="task-text">${escapeHtml(task.text)}</div>
          </div>
          <div class="task-actions">
            <button class="task-btn select" onclick="setActiveTask(${task.id})" title="Set as active">
              ${task.id === activeTaskId ? '✓' : '○'}
            </button>
            <button class="task-btn delete" onclick="removeTask(${task.id})" title="Delete">
              🗑️
            </button>
          </div>
        </li>
      `).join('');

      // Auto-select first task if none selected
      if (!activeTaskId && tasks.length > 0) {
        activeTaskId = tasks[0].id;
        renderTasks();
        return;
      }

      // Update button state
      updateStartButton();
    }

    function toggleMonitoring() {
      if (isMonitoring) {
        stopMonitoring();
      } else {
        startMonitoring();
      }
    }

    function startMonitoring() {
      if (!activeTaskId || isMonitoring) return;

      const activeTask = tasks.find(t => t.id === activeTaskId);
      if (!activeTask) return;

      window.electronAPI.startMonitoring(activeTask.text);
      // Note: isMonitoring will be set by the onMonitoringStarted callback
    }

    function stopMonitoring() {
      if (!isMonitoring) return;
      window.electronAPI.stopMonitoring();
      // Note: isMonitoring will be set by the onMonitoringStopped callback
    }

    function updateStartButton() {
      const btn = document.getElementById('startBtn');

      if (isMonitoring) {
        btn.innerHTML = '<span class="status-indicator active"></span> Stop Monitoring';
        btn.disabled = false;
        btn.style.background = 'linear-gradient(135deg, #ff5f56 0%, #ff3838 100%)';
      } else {
        btn.innerHTML = '<span class="status-indicator inactive"></span> Start Monitoring';
        btn.disabled = !activeTaskId || tasks.length === 0;
        btn.style.background = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
      }
    }

    // Persistence
    function saveTasks() {
      localStorage.setItem('tasks', JSON.stringify(tasks));
      localStorage.setItem('activeTaskId', activeTaskId);
    }

    function loadTasks() {
      const savedTasks = localStorage.getItem('tasks');
      const savedActiveId = localStorage.getItem('activeTaskId');

      if (savedTasks) {
        tasks = JSON.parse(savedTasks);
      }

      if (savedActiveId) {
        activeTaskId = parseInt(savedActiveId);
      }

      renderTasks();
    }

    // Monitoring status functions
    function showMonitoringSection() {
      const section = document.getElementById('monitoringSection');
      section.style.display = 'block';
    }

    function hideMonitoringSection() {
      const section = document.getElementById('monitoringSection');
      section.style.display = 'none';
    }

    function updateStatusText(message) {
      const statusText = document.getElementById('statusText');
      statusText.textContent = message;
    }

    // Utility
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
