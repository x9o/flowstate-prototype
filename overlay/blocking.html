<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
  <title>Focus Protector - Blocked</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #d32f2f 0%, #c62828 100%);
      color: white;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: default;
      user-select: none;
    }

    .container {
      text-align: center;
      padding: 60px;
      max-width: 900px;
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.9);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.05);
      }
    }

    .icon {
      font-size: 120px;
      margin-bottom: 30px;
      animation: pulse 2s ease-in-out infinite;
    }

    h1 {
      font-size: 56px;
      font-weight: 700;
      margin-bottom: 30px;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.3);
    }

    .message {
      font-size: 24px;
      margin-bottom: 40px;
      line-height: 1.6;
      opacity: 0.95;
    }

    .details {
      background: rgba(0, 0, 0, 0.2);
      padding: 30px;
      border-radius: 16px;
      margin: 40px 0;
      backdrop-filter: blur(10px);
    }

    .detail-row {
      margin: 20px 0;
      font-size: 20px;
    }

    .label {
      font-weight: 600;
      text-transform: uppercase;
      font-size: 14px;
      letter-spacing: 1px;
      opacity: 0.8;
      margin-bottom: 8px;
    }

    .value {
      font-size: 24px;
      font-weight: 500;
    }

    .divider {
      height: 2px;
      background: rgba(255, 255, 255, 0.3);
      margin: 30px auto;
      width: 80%;
    }

    .button {
      background: white;
      color: #d32f2f;
      border: none;
      padding: 20px 50px;
      font-size: 20px;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 30px;
    }

    .button:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
      background: #f5f5f5;
    }

    .button:active {
      transform: translateY(-1px);
    }

    .button-container {
      display: flex;
      gap: 20px;
      justify-content: center;
      align-items: center;
      margin-top: 30px;
      flex-wrap: wrap;
    }

    .secondary-button {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: 2px solid rgba(255, 255, 255, 0.5);
    }

    .secondary-button:hover {
      background: rgba(255, 255, 255, 0.3);
      border-color: rgba(255, 255, 255, 0.8);
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
    }

    .hint {
      margin-top: 25px;
      font-size: 16px;
      opacity: 0.8;
    }

    .keyboard-hint {
      display: inline-block;
      background: rgba(255, 255, 255, 0.2);
      padding: 8px 16px;
      border-radius: 8px;
      font-family: monospace;
      font-weight: 600;
      margin: 0 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🚫</div>
    <h1>Off-Task Activity Detected</h1>
    <p class="message">
      You're drifting away from your goal. Let's refocus!
    </p>

    <div class="details">
      <div class="detail-row">
        <div class="label">Your Goal</div>
        <div class="value" id="goal">Loading...</div>
      </div>

      <div class="divider"></div>

      <div class="detail-row">
        <div class="label">Blocked Activity</div>
        <div class="value" id="activity">Loading...</div>
      </div>
    </div>

    <div class="button-container">
      <button class="button secondary-button" id="whitelistBtn" onclick="markAsProductive()">
        Mark as Productive
      </button>

      <button class="button" id="dismissBtn" onclick="dismissOverlay()">
        Return to Work
      </button>
    </div>

    <p class="hint">
      Or press <span class="keyboard-hint">ESC</span> to dismiss
    </p>
  </div>

  <script>
    // Check if electronAPI is available
    let electronAPIAvailable = false;

    // Listen for blocking data from main process
    if (window.electronAPI) {
      electronAPIAvailable = true;
      console.log('Electron API available');

      window.electronAPI.onBlockingData((data) => {
        console.log('Received blocking data:', data);
        document.getElementById('goal').textContent = data.goal;
        document.getElementById('activity').textContent = data.activity;
      });
    } else {
      console.error('Electron API not available!');
      document.getElementById('goal').textContent = 'Error: No connection';
      document.getElementById('activity').textContent = 'Error: No connection';
    }

    // Mark as productive function
    function markAsProductive() {
      console.log('Mark as Productive button clicked');

      if (electronAPIAvailable && window.electronAPI) {
        console.log('Sending whitelist signal');
        window.electronAPI.markAsProductive();

        // Show confirmation message
        const activityElement = document.getElementById('activity');
        const originalActivity = activityElement.textContent;

        // Update UI to show confirmation
        document.querySelector('.icon').textContent = '✅';
        document.querySelector('h1').textContent = 'Marked as Productive';
        document.querySelector('.message').textContent = 'This window will no longer be blocked during this session.';

        // Change button container to show confirmation
        const buttonContainer = document.querySelector('.button-container');
        buttonContainer.innerHTML = `
          <button class="button" onclick="dismissOverlay()">
            Continue Working
          </button>
        `;

        console.log(`Activity "${originalActivity}" marked as productive`);
      } else {
        console.error('Cannot mark as productive: electronAPI not available');
        // Fallback: try to close window directly
        if (window.close) {
          window.close();
        }
      }
    }

    // Dismiss overlay function
    function dismissOverlay() {
      console.log('Dismiss button clicked');

      if (electronAPIAvailable && window.electronAPI) {
        console.log('Sending dismiss signal');
        window.electronAPI.dismissOverlay();
      } else {
        console.error('Cannot dismiss: electronAPI not available');
        // Fallback: try to close window directly
        if (window.close) {
          window.close();
        }
      }
    }

    // Handle ESC key
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        console.log('ESC key pressed');
        dismissOverlay();
      }
    });

    // Focus button on load for keyboard accessibility
    window.addEventListener('load', () => {
      console.log('Page loaded');
      const dismissBtn = document.getElementById('dismissBtn');
      if (dismissBtn) {
        dismissBtn.focus();
        console.log('Button focused');
      }

      // Add click event listener as backup
      dismissBtn.addEventListener('click', function(e) {
        console.log('Button clicked via event listener');
        e.preventDefault();
        dismissOverlay();
      });
    });

    // Debug: log page load state
    document.addEventListener('DOMContentLoaded', () => {
      console.log('DOM Content Loaded');
    });
  </script>
</body>
</html>
